<div class="flex flex-col items-center">
  <div>
    <canvas id="gitChart"></canvas>
  </div>
  <div class="p-10">
    <ul class="list-decimal">
      <li>{{'git-init-first-step' | translate }}</li>
      <li>{{'git-init-second-step' | translate }}</li>
    <li>{{'git-init-third-step' | translate }}</li>
    </ul>
    {{'git-init-fourth-step' | translate }}
    <div *ngIf="checkQuiet()">
      <p>{{'git-init-quiet-option' | translate}}</p>
    </div>
    <div *ngIf="checkBare()">
      <p>{{'git-init-bare-option' | translate}}</p>
    </div>
  </div>
</div>
