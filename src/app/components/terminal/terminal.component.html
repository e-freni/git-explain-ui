<div class="terminal pl-2" (click)="focusInput()">
  <div class="output">
    <p *ngFor="let line of terminalOutput">{{ line }}</p>
    <div class="input-line">
      <span>{{ prompt }}</span>
      <input #inputField type="text" [(ngModel)]="currentCommand" (keyup.enter)="executeCommand()" autofocus />
    </div>
  </div>
</div>
